# /etc/nginx/sites-available/kabatufarm-pb
#
# Separate subdomain for PocketBase, distinct from kabatufarm.duckdns.org
# (which points at Next.js on :3000). The Next.js app's browser-side code
# needs to reach this over the public internet — it can't use 127.0.0.1,
# since auth/login happens in the user's browser, not on your server.
#
# Setup:
#   sudo cp kabatufarm-pb /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/kabatufarm-pb /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pb.kabatufarm.duckdns.org
#
# Replace 203.0.113.0 below with YOUR actual home/office IP before relying
# on this — check with `curl ifconfig.me` from the machine you'll admin from.

server {
    listen 80;
    server_name pb.kabatufarm.duckdns.org;

    # Admin UI — restricted. Anyone not on the allowlist gets a 403,
    # never even reaches PocketBase's own login screen.
    location /_/ {
        allow 203.0.113.0;   # <- your admin IP
        deny all;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API — public. This is what the Next.js app's browser-side auth,
    # record CRUD, and realtime subscriptions actually call.
    location /api/ {
        proxy_pass          http://127.0.0.1:8091;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection 'upgrade';
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Everything else (PocketBase's own default landing page etc.) — also
    # locked down, since there's no reason the public needs it.
    location / {
        allow 203.0.113.0;
        deny all;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }
}
